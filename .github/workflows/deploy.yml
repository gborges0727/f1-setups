name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, so two quick pushes can't race each other's releases.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Work out the version
        id: version
        run: python3 scripts/version.py

      - name: Build the site
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/build.py

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx -y wrangler@4.151.1 pages deploy site
          --project-name f1-setups
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "${{ steps.version.outputs.version }}"

      - name: Publish the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
