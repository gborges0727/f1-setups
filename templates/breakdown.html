<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one card per setting, each a bar chart of what the fastest setups run, with F1Laps' median marked. */
:root {
  --bg: #f3f5f7;
  --sheet: #ffffff;
  --ink: #16202b;
  --muted: #5b6876;
  --rule: #d9dfe5;
  --track: #e9edf1;
  --bar: #9aa7b4;
  --agree: #7b2fd6;
  --change: #b4410f;
  --accent: #1d5fa8;
  --accent-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --sheet: #17202a; --ink: #e6ebf0; --muted: #98a5b3; --rule: #2a3542;
  --track: #1f2a36; --bar: #4f5d6c; --agree: #b07cff; --change: #ff9a62;
  --accent: #5d9ce6; --accent-ink: #0f151c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --sheet: #17202a; --ink: #e6ebf0; --muted: #98a5b3; --rule: #2a3542;
  --track: #1f2a36; --bar: #4f5d6c; --agree: #b07cff; --change: #ff9a62;
  --accent: #5d9ce6; --accent-ink: #0f151c; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 24px 8px; }
nav.home { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.88rem; margin-bottom: 12px; }
nav.home a { color: var(--muted); text-decoration: none; }
nav.home a:hover { color: var(--ink); }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 68ch; margin: 10px 0 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); margin-top: 18px; }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; padding-block: 12px; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl > span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 0.9rem var(--body); background: transparent; color: var(--ink); border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { color: var(--muted); cursor: not-allowed; text-decoration: line-through; }
select { font: 500 0.95rem var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; min-width: 0; max-width: 100%; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl.track { flex: 1 1 220px; min-width: 0; }
.ctl.track select { width: 100%; }

main { padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.summary { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.summary h2 { font-family: var(--display); font-size: 1.5rem; text-transform: uppercase; margin: 0; line-height: 1.1; }
.summary .sub { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
.summary h4 { margin: 14px 0 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.summary ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.summary .none { margin: 6px 0 0; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.warn { margin: 12px 0 0; font-size: 0.9rem; padding: 10px 12px; border-radius: 6px; background: var(--track); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.85rem; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 18px; height: 8px; border-radius: 2px; background: var(--bar); }
.swatch.top { background: var(--accent); }

section.group h3 { font-family: var(--display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.set { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.set.differs { border-color: var(--change); }
.set .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 4px; }
.set .name { font-weight: 600; margin-right: auto; }
.set .vs { font-size: 0.82rem; color: var(--muted); margin: 0 0 8px; }
.set .vs b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.set.differs .vs { color: var(--change); }
.chip { display: inline-block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.chip.lock { background: var(--agree); color: var(--sheet); }
.chip.same { border: 1px solid var(--rule); color: var(--muted); }
.rows { display: grid; gap: 3px; }
.row { display: grid; grid-template-columns: 8.5ch 1fr auto; gap: 8px; align-items: center; font-size: 0.85rem; }
.row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .track { height: 10px; background: var(--track); border-radius: 2px; overflow: hidden; }
.row .track i { display: block; height: 100%; background: var(--bar); }
.row.top .track i { background: var(--accent); }
.row.top .v { font-weight: 600; }
.row .c { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.row.median .v::after { content: " ◆"; color: var(--change); }
.set .nodata { margin: 0; font-size: 0.85rem; color: var(--muted); }
.notes { color: var(--muted); font-size: 0.9rem; display: grid; gap: 8px; max-width: 72ch; }
.notes p { margin: 0; }
.notes a { color: var(--accent); }
@media (max-width: 560px) { h1 { font-size: 2rem; } .row { grid-template-columns: 7.5ch 1fr auto; } .row .unit { display: none; } }
</style>

<header class="top"><div class="wrap">
  <nav class="home"><a href="/">← All setup sheets</a><a data-keep="__SHEET_URL__" href="__SHEET_URL__">Main sheet →</a></nav>
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="ctl track"><span>Track</span><select id="track" aria-label="Track"></select></div>
  <div class="ctl"><span>Weather</span><div class="seg" id="weather" role="group" aria-label="Weather"></div></div>
  <div class="ctl"><span>Setups from</span><div class="seg" id="view" role="group" aria-label="Setups from"></div></div>
</div></div>

<main class="wrap" id="main"></main>

<script>
const CONFIG = __CONFIG__;
const TRACKS = __DATA__;

__COMMON__

const ORDER = TRACKS.map(t => t.id);
const BY_ID = Object.fromEntries(TRACKS.map(t => [t.id, t]));

let state = { slug: ORDER[0], cond: "dry", view: "race" };
try {
  const s = JSON.parse(localStorage.getItem(CONFIG.key) || "null");
  if (s && BY_ID[s.slug]) state = Object.assign(state, s);
} catch (e) {}
state.slug = startSlug(state.slug);
state.view = startView(state.view);
function save() { try { localStorage.setItem(CONFIG.key, JSON.stringify(state)); } catch (e) {} }

function seg(el, opts, cur, onPick, disabled) {
  el.innerHTML = "";
  for (const [val, label] of opts) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(val === cur));
    if (disabled && disabled(val)) { b.disabled = true; b.title = "F1Laps doesn't have enough wet setups for this track"; }
    b.addEventListener("click", () => onPick(val));
    el.appendChild(b);
  }
}

// One card: every value the fastest setups run, lowest first, with the reference value coloured and the median marked.
// The reference is the Shared column's value on a dry sheet and the sheet's value on a wet one.
function card(k, base, f, ref) {
  const shown = base.out[k], median = base.median[k];
  const differs = shown !== median;
  const chip = base.agreed.has(k) ? `<span class="chip lock">Agreed</span>` : `<span class="chip same">Open</span>`;
  let h = `<div class="set${differs ? " differs" : ""}"><div class="head"><span class="name">${F[k].label}</span>${chip}</div>`;
  h += `<p class="vs">${ref} <b>${fmt(k, shown)}</b> · F1Laps median <b>${fmt(k, median)}</b></p>`;
  if (!base.counted.has(k)) {
    const why = f && f.n >= 5 ? "F1Laps' setup pages don't show this setting." : `F1Laps lists only ${f ? f.n : 0} setups here, too few to count.`;
    return h + `<p class="nodata">${why} The sheet uses F1Laps' median.</p></div>`;
  }
  const counts = f.counts[F[k].src].slice();
  if (!counts.some(([v]) => v === median)) counts.push([median, 0]);
  counts.sort((a, b) => a[0] - b[0]);
  const most = Math.max(...counts.map(([, c]) => c));
  h += `<div class="rows">` + counts.map(([v, c]) => {
    const cls = [v === shown ? "top" : "", v === median ? "median" : ""].join(" ").trim();
    return `<div class="row ${cls}"><span class="v">${fmt(k, v)}</span><span class="track"><i style="width:${c / most * 100}%"></i></span><span class="c">${c} · ${Math.round(c / f.n * 100)}%</span></div>`;
  }).join("") + `</div>`;
  return h + `</div>`;
}

function render() {
  const t = BY_ID[state.slug];
  if (!t.wet) state.cond = "dry";
  const base = consensus(t, state.cond, state.view);
  const f = t.fastest && t.fastest[state.cond] && t.fastest[state.cond][state.view];
  const ref = base.cols.some(c => c.key === "shared") ? "Shared" : "Sheet";
  const refName = ref === "Shared" ? "the Shared column" : "the sheet";

  seg(document.getElementById("weather"), [["dry", "Dry"], ["wet", "Wet"]], state.cond, v => { state.cond = v; render(); }, v => !t[v]);
  seg(document.getElementById("view"), VIEWS, state.view, v => { state.view = v; render(); });
  const sel = document.getElementById("track");
  sel.innerHTML = ORDER.map(s => `<option value="${s}"${s === state.slug ? " selected" : ""}>${esc(BY_ID[s].name)}</option>`).join("");

  const keys = FIELDS.map(x => x[0]).filter(k => k in base.out);
  const moved = keys.filter(k => base.out[k] !== base.median[k]);
  const share = k => {
    const c = base.counted.has(k) && f.counts[F[k].src].find(([v]) => v === base.out[k]);
    return c ? ` (${Math.round(c[1] / f.n * 100)}% of setups)` : "";
  };
  let h = `<div class="summary"><h2>${esc(t.name)}</h2><div class="sub">${CONFIG.cars} · ${state.cond === "dry" ? "Dry" : "Wet"} · ${f ? f.n : 0} fastest ${pool(state.view)} counted</div>`;
  h += `<h4>Where ${refName} differs from F1Laps' median</h4>`;
  h += moved.length
    ? `<ul>` + moved.map(k => `<li>${F[k].label}: <span class="mono">${fmt(k, base.median[k])} → <strong>${fmt(k, base.out[k])}</strong></span>${share(k)}</li>`).join("") + `</ul>`
    : `<p class="none">${refName[0].toUpperCase() + refName.slice(1)} matches F1Laps' median on every setting.</p>`;
  if (!f || f.n < 5) h += `<p class="warn">F1Laps lists only ${f ? f.n : 0} ${state.cond} ${pool(state.view)} at this track, too few to count. Every value here is F1Laps' median.</p>`;
  if (!t.wet) h += `<p class="warn">F1Laps doesn't have enough wet setups at this track, so only the dry breakdown is available.</p>`;
  h += `</div>`;

  h += `<div class="legend">
    <span><span class="swatch top"></span> the value in ${refName}</span>
    <span><span class="swatch"></span> other values</span>
    <span><span style="color:var(--change)">◆</span> F1Laps median of its 100 fastest setups</span>
    <span><span class="chip lock">Agreed</span> at least 70% run the value in ${refName}</span>
  </div>`;

  for (const [g, gk] of GROUPS) {
    const rows = gk.filter(k => k in base.out);
    if (!rows.length) continue;
    h += `<section class="group"><h3>${g}</h3><div class="cards">${rows.map(k => card(k, base, f, ref)).join("")}</div></section>`;
  }

  h += `<div class="notes">${CONFIG.notes}<p>Source: <a href="${esc(t.url.replace(/meta\/$/, ""))}" target="_blank" rel="noopener">F1Laps ${esc(t.name)} setups</a> and <a href="${esc(t.url)}" target="_blank" rel="noopener">meta setup</a>, fetched ${esc(CONFIG.fetched)}.</p></div>`;

  document.getElementById("main").innerHTML = h;
  keepTrack(state.slug, state.view);
  save();
}
document.getElementById("track").addEventListener("change", e => { state.slug = e.target.value; render(); });
render();
</script>
