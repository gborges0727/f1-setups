<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a race engineer's setup sheet. Sticky selector bar, then one ruled table per garage menu. */
:root {
  --bg: #f3f5f7;
  --sheet: #ffffff;
  --ink: #16202b;
  --muted: #5b6876;
  --rule: #d9dfe5;
  --lock: #7a8693;
  --lock-bg: #e9edf1;
  --change: #b4410f;
  --agree: #7b2fd6;
  --accent: #1d5fa8;
  --accent-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --sheet: #17202a; --ink: #e6ebf0; --muted: #98a5b3; --rule: #2a3542;
  --lock: #8592a0; --lock-bg: #1f2a36; --change: #ff9a62; --agree: #b07cff;
  --accent: #5d9ce6; --accent-ink: #0f151c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --sheet: #17202a; --ink: #e6ebf0; --muted: #98a5b3; --rule: #2a3542;
  --lock: #8592a0; --lock-bg: #1f2a36; --change: #ff9a62; --agree: #b07cff;
  --accent: #5d9ce6; --accent-ink: #0f151c; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 24px 8px; }
nav.home { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.88rem; margin-bottom: 12px; }
nav.home a { color: var(--muted); text-decoration: none; }
nav.home a:hover { color: var(--ink); }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.4rem; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); max-width: 68ch; margin: 10px 0 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); margin-top: 18px; }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; padding-block: 12px; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
.ctl[hidden] { display: none; }
.ctl > span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 0.9rem var(--body); background: transparent; color: var(--ink); border: 0; padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { color: var(--lock); cursor: not-allowed; text-decoration: line-through; }
select { font: 500 0.95rem var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; min-width: 0; max-width: 100%; }
button:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctl.track { flex: 1 1 220px; min-width: 0; }
.ctl.track select { width: 100%; }

main { padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.summary { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; }
.summary h2 { font-family: var(--display); font-size: 1.5rem; text-transform: uppercase; margin: 0; line-height: 1.1; }
.summary .sub { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { margin: 12px 0 0; font-size: 0.88rem; color: var(--muted); }
.warn { margin: 12px 0 0; font-size: 0.9rem; padding: 10px 12px; border-radius: 6px; background: var(--lock-bg); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 0.85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

section.group h3 { font-family: var(--display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
.tablewrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
thead th { border-top: 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.name { font-weight: 500; }
.chip { display: inline-block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
.chip.lock { background: var(--agree); color: var(--sheet); }
.chip.same { border: 1px solid var(--rule); color: var(--muted); }
.chip.odd { border: 1px solid var(--change); color: var(--change); }
/* A chip with a spread opens a box listing what the fastest setups run, on hover, focus or tap. */
button.chip { font-family: inherit; line-height: inherit; background: none; border: 0; cursor: help; }
.tipbox { position: fixed; z-index: 10; max-width: min(320px, calc(100vw - 32px)); padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18); font-size: 0.8rem; color: var(--muted); }
.tipbox[hidden] { display: none; }
.tipbox .dist { flex-direction: column; gap: 2px; }
.dist { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.dist b { color: var(--ink); font-weight: 600; }
.dist .num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.notes { color: var(--muted); font-size: 0.9rem; display: grid; gap: 8px; max-width: 72ch; }
.notes p { margin: 0; }
.notes a { color: var(--accent); }

/* Fixed column widths so every group's table lines up with the others. */
table.sheet { table-layout: fixed; }
/* The name column holds the setting and its chip. The value columns share the rest equally.
   cols-N counts the value columns: 1 on a wet sheet and 3 on a dry one. */
table.sheet th.c-name { width: 52%; }
table.sheet.cols-3 th.c-name { width: 40%; }
td.name .chip { margin-left: 6px; vertical-align: 1px; }
td.val.moved { color: var(--accent); font-weight: 600; }
.movedkey { color: var(--accent); }

@media (max-width: 560px) {
  h1 { font-size: 2rem; }
  table.sheet th, table.sheet td { padding: 8px 6px; }
  table.sheet .chip { font-size: 0.62rem; padding: 2px 5px; letter-spacing: 0.03em; }
  table.sheet td.num { font-size: 0.86rem; }
  table.sheet .unit { display: none; }
  table.sheet thead th { letter-spacing: 0.03em; }
  table.sheet th.c-name { width: 46%; }
  table.sheet.cols-3 th.c-name { width: 34%; }
  td.name .chip { margin-left: 0; margin-top: 3px; }
  td.name .lbl { display: block; }
}
</style>

<header class="top"><div class="wrap">
  <nav class="home"><a href="/">← All setup sheets</a><a data-keep="__BREAKDOWN_URL__" href="__BREAKDOWN_URL__">Breakdown →</a></nav>
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="ctl track"><span>Track</span><select id="track" aria-label="Track"></select></div>
  <div class="ctl"><span>Weather</span><div class="seg" id="weather" role="group" aria-label="Weather"></div></div>
  <div class="ctl"><span>Setups from</span><div class="seg" id="view" role="group" aria-label="Setups from"></div></div>
</div></div>

<main class="wrap" id="main"></main>
<div class="tipbox" id="tip" role="tooltip" hidden></div>

<script>
const CONFIG = __CONFIG__;
const TRACKS = __DATA__;

__COMMON__

const ORDER = TRACKS.map(t => t.id);
const BY_ID = Object.fromEntries(TRACKS.map(t => [t.id, t]));

// What one F1Laps list's fastest setups use for one setting: the range, the share of each common
// value, and F1Laps' median when it differs from the reference value.
function spread(t, cond, view, k, shown, median) {
  const f = t.fastest && t.fastest[cond] && t.fastest[cond][view];
  const counts = f && f.counts[F[k].src];
  if (!counts || f.n < 5) return "";
  const vals = counts.map(([v]) => v);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pct = c => Math.round(c / f.n * 100) + "%";
  // Show up to five values. Past that, show four and add up the rest.
  const top = counts.length > 5 ? counts.slice(0, 4) : counts, rest = counts.slice(top.length);
  const bare = v => fmt(k, v).replace(/<span class="unit">.*?<\/span>|[%°]/g, "");
  let h = `<span>The ${f.n} fastest ${pool(view)} use <span class="num">${lo === hi ? fmt(k, lo) : bare(lo) + "–" + fmt(k, hi)}</span></span>`;
  h += top.map(([v, c]) => `<span class="num"><b>${pct(c)}</b> run ${fmt(k, v)}</span>`).join("");
  if (rest.length) h += `<span><b>${pct(rest.reduce((a, [, c]) => a + c, 0))}</b> spread over ${rest.length} other values</span>`;
  if (shown !== median) h += `<span>F1Laps median <span class="num">${fmt(k, median)}</span></span>`;
  return `<div class="dist">${h}</div>`;
}

let state = { slug: ORDER[0], cond: "dry", view: "race" };
try {
  const s = JSON.parse(localStorage.getItem(CONFIG.key) || "null");
  if (s && BY_ID[s.slug]) state = Object.assign(state, s);
} catch (e) {}
state.slug = startSlug(state.slug);
state.view = startView(state.view);
function save() { try { localStorage.setItem(CONFIG.key, JSON.stringify(state)); } catch (e) {} }

function seg(el, opts, cur, onPick, disabled) {
  el.innerHTML = "";
  for (const [val, label] of opts) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(val === cur));
    if (disabled && disabled(val)) { b.disabled = true; b.title = "F1Laps doesn't have enough wet setups for this track"; }
    b.addEventListener("click", () => onPick(val));
    el.appendChild(b);
  }
}

function names(items) { return items.length === 1 ? items[0] : items.slice(0, -1).join(", ") + " and " + items[items.length - 1]; }

function render() {
  const t = BY_ID[state.slug];
  if (!t.wet) state.cond = "dry";
  // F1Laps lists too few wet Time Trial setups to count, so wet sheets always show race setups
  // and hide the switch. The chosen view comes back on the dry sheet.
  const view = state.cond === "wet" ? "race" : state.view;
  const race = view === "race";
  const base = consensus(t, state.cond, view);
  const meta = base.out;
  const lock = base.agreed;
  const cols = base.cols;
  const byKey = Object.fromEntries(cols.map(c => [c.key, c]));

  seg(document.getElementById("weather"), [["dry", "Dry"], ["wet", "Wet"]], state.cond, v => { state.cond = v; render(); }, v => !t[v]);
  seg(document.getElementById("view"), VIEWS, state.view, v => { state.view = v; render(); });
  document.getElementById("view").parentElement.hidden = state.cond === "wet";
  const sel = document.getElementById("track");
  sel.innerHTML = ORDER.map(s => `<option value="${s}"${s === state.slug ? " selected" : ""}>${esc(BY_ID[s].name)}</option>`).join("");

  const fast = byKey.fast;

  const sub = [CONFIG.cars, state.cond === "dry" ? "Dry" : "Wet", race ? "Race" : "Time Trial"];
  let h = `<div class="summary"><h2>${esc(t.name)}</h2><div class="sub">${sub.join(" · ")}</div>`;
  const list = `the ${base.n} fastest ${pool(view)}`;
  // Who runs a column's setup, and how its best lap compares with the fastest in the list.
  const who = p => p.runs === 1 ? "One driver runs it." : `${p.runs} different drivers run it.`;
  const paceLine = p => p.best === 1 ? "It set the fastest lap in the list."
    : p.gap === null ? `Its best lap is number ${p.best} in the list, and F1Laps shows no lap time for it.`
    : `Its best lap is ${p.gap.toFixed(3)} s off the fastest.`;
  const note = s => `<p class="note">${s}</p>`;
  if (base.n < 5) h += `<p class="warn">F1Laps lists only ${base.n} ${state.cond} ${pool(view)} at this track, too few to count. Every value here is F1Laps' median of its 100 fastest setups.</p>`;
  for (const c of cols) {
    const p = c.info;
    if (c.key === "setup" && base.n >= 5) h += note(`Each setting is the value most of ${list} run.`);
    if (c.key === "fast") h += note(`The Fast column is the quickest of ${list}, even when only one driver runs it. ${who(p)} ${paceLine(p)}`);
    if (c.key === "shared") h += note(p ? `The Shared Fast column is the quickest setup that two or more different drivers run. ${who(p)} ${paceLine(p)}`
      : `No two drivers among ${list} run the same setup, so the Shared Fast column shows the value most of them run for each setting.`);
    if (c.key === "popular" && !p) h += note(`F1Laps shows no setup groups for ${list}, so the Popular column shows the value most of them run for each setting.`);
    else if (c.key === "popular") h += note(p.runs >= 2 ? `The Popular column is the setup the most different drivers run, and the quicker one wins a tie. ${who(p)} ${paceLine(p)}`
      : `No two drivers among ${list} run the same setup, so the Popular column shows the quickest one-driver setup. ${paceLine(p)}`);
  }
  // Two columns can hold the same setup. Say so instead of hiding one.
  const same = {};
  for (const c of cols) (same[JSON.stringify(Object.keys(meta).map(k => c.values[k]))] ||= []).push(c.name);
  for (const group of Object.values(same)) if (group.length > 1) h += note(`The ${names(group)} columns are the same setup here.`);
  if (!t.wet) h += `<p class="warn">F1Laps doesn't have enough wet setups at this track, so only the dry setup is available.</p>`;
  h += `</div>`;

  const ref = byKey.popular ? "the value in the Popular column" : "the value shown";
  h += `<div class="legend">
    <span><span class="chip lock">Agreed</span> at least 70% of these setups run ${ref}</span>
    <span><span class="chip same">Open</span> the fastest setups split, so adjust it to taste. Hover over or tap the chip to see what they run.</span>
    ${base.against.size ? `<span><span class="chip odd">Unusual</span> at least 70% of these setups run a value other than ${ref}. Hover over or tap the chip to see which.</span>` : ""}
    ${fast ? `<span><b class="movedkey">Blue values</b> differ from the Fast column.</span>` : ""}
  </div>`;

  tips = [];
  const shown = cols.map(c => ({ name: c.name, cls: c === fast ? "" : fast ? " val" : "", values: c.values }));
  for (const [g, keys] of GROUPS) {
    const rows = keys.filter(k => k in meta);
    if (!rows.length) continue;
    h += `<section class="group"><h3>${g}</h3><div class="tablewrap"><table class="sheet cols-${shown.length}"><thead><tr>
      <th class="c-name">Setting</th>${shown.map(c => `<th class="c-val">${c.name}</th>`).join("")}</tr></thead><tbody>`;
    for (const k of rows) {
      const [cls, word] = lock.has(k) ? ["lock", "Agreed"] : base.against.has(k) ? ["odd", "Unusual"] : ["same", "Open"];
      const dist = lock.has(k) && meta[k] === base.median[k] ? "" : spread(t, state.cond, view, k, meta[k], base.median[k]);
      const chip = dist ? `<button type="button" class="chip ${cls}" data-tip="${tips.push(dist) - 1}" aria-label="${word}, show what the fastest setups run">${word}</button>`
        : `<span class="chip ${cls}">${word}</span>`;
      h += `<tr><td class="name"><span class="lbl">${F[k].label}</span>${chip}</td>`;
      for (const c of shown) {
        const moved = c.cls === " val" && c.values[k] !== fast.values[k];
        h += `<td class="num${c.cls}${moved ? " moved" : ""}">${fmt(k, c.values[k])}</td>`;
      }
      h += `</tr>`;
    }
    h += `</tbody></table></div></section>`;
  }

  h += `<div class="notes">${CONFIG.notes}<p>Source: <a href="${esc(t.url.replace(/meta\/$/, ""))}" target="_blank" rel="noopener">F1Laps ${esc(t.name)} setups</a> and <a href="${esc(t.url)}" target="_blank" rel="noopener">meta setup</a>, fetched ${esc(CONFIG.fetched)}. F1Laps updates these numbers as new laps arrive.</p></div>`;

  hideTip();
  document.getElementById("main").innerHTML = h;
  keepTrack(state.slug, state.view);
  save();
}
document.getElementById("track").addEventListener("change", e => { state.slug = e.target.value; render(); });

// The spread box. render() fills tips with each chip's spread, and the chip's data-tip indexes it.
// A mouse opens the box on hover, a keyboard on focus, and a tap on a phone by clicking the chip.
let tips = [], tipFor = null;
const tipBox = document.getElementById("tip");
function showTip(b) {
  tipFor = b;
  tipBox.innerHTML = tips[b.dataset.tip];
  tipBox.hidden = false;
  b.setAttribute("aria-describedby", "tip");
  const r = b.getBoundingClientRect(), w = tipBox.offsetWidth, ht = tipBox.offsetHeight;
  tipBox.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  tipBox.style.top = (r.bottom + 6 + ht > innerHeight ? r.top - 6 - ht : r.bottom + 6) + "px";
}
function hideTip() {
  if (tipFor) tipFor.removeAttribute("aria-describedby");
  tipFor = null;
  tipBox.hidden = true;
}
const main = document.getElementById("main");
main.addEventListener("pointerover", e => { const b = e.target.closest("[data-tip]"); if (b && e.pointerType === "mouse") showTip(b); });
main.addEventListener("pointerout", e => { const b = e.target.closest("[data-tip]"); if (b && e.pointerType === "mouse" && !b.contains(e.relatedTarget) && document.activeElement !== b) hideTip(); });
main.addEventListener("focusin", e => { const b = e.target.closest("[data-tip]"); if (b) showTip(b); });
main.addEventListener("focusout", e => { if (e.target.closest("[data-tip]")) hideTip(); });
main.addEventListener("click", e => { const b = e.target.closest("[data-tip]"); if (b) { e.stopPropagation(); showTip(b); } });
document.addEventListener("click", hideTip);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
addEventListener("scroll", hideTip, true);
addEventListener("resize", hideTip);
render();
</script>
